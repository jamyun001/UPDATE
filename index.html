<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>체르 평지생존 : 리바이브</title>
<style>
:root {
  --bg: #f9fbfd;
  --card: #e8ecf1;
  --hover: #d4dae3;
  --text: #222;
  --accent: #007aff;
}

body.dark {
  --bg: #121212;
  --card: #1e1e1e;
  --hover: #2a2a2a;
  --text: #eee;
  --accent: #00e1ff;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Segoe UI', sans-serif;
  transition: 0.3s;
  line-height: 1.4;
}

.container {
  max-width: 700px;
  margin: 0 auto;
  padding: 1.2rem 1rem;
  display: flex;
  flex-direction: column;
  position: relative;
}

h1 {
  text-align: center;
  color: var(--accent);
  font-size: 1.8rem;
  margin-bottom: 1rem;
}

.theme-toggle {
  position: absolute;
  top: 1rem;
  right: 1rem;
  background: none;
  border: none;
  font-size: 1.4rem;
  cursor: pointer;
  color: var(--accent);
}

.notice-item {
  background: var(--card);
  padding: 0.8rem 1rem;
  border-radius: 12px;
  margin-bottom: 0.6rem;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
  transition: all 0.2s ease;
}

.notice-item:hover {
  background: var(--hover);
  transform: scale(1.02);
}

.notice-title {
  font-weight: 600;
}

.notice-preview {
  font-size: 0.9rem;
  color: gray;
  margin-top: 0.2rem;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

#detail-view {
  display: none;
  flex-direction: column;
  animation: fadeIn 0.3s ease;
  width: 100%;
}

.back-button {
  background: none;
  border: none;
  color: var(--accent);
  font-size: 1rem;
  cursor: pointer;
  margin-bottom: 1rem;
  padding: 0;
  align-self: flex-start;
}

#notice-body {
  font-size: 1rem;
  line-height: 1.5;
  margin-bottom: 2rem;
  white-space: pre-wrap;
}

#notice-body img {
  max-width: 100%;
  border-radius: 12px;
  margin: 1rem 0;
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(10px); }
  to { opacity: 1; transform: translateY(0); }
}

@media (max-width: 600px) {
  .container { padding: 1rem; }
  h1 { font-size: 1.5rem; }
}
</style>
</head>
<body>
<div class="container">
  <button class="theme-toggle">🌙</button>
  <h1>📢 공지사항</h1>
  <div id="list-view"></div>

  <div id="detail-view">
    <button class="back-button" onclick="location.reload()">← 목록으로</button>
    <div id="notice-body"></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyBky_h8nCq37v7bGkKehISjCugMcUF9uCU",
  authDomain: "update-25ffa.firebaseapp.com",
  projectId: "update-25ffa",
  storageBucket: "update-25ffa.firebasestorage.app",
  messagingSenderId: "1019773539321",
  appId: "1:1019773539321:web:90a2dcd7a8b63bc35ea328",
  measurementId: "G-5QGR70N5HH"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();

const listView = document.getElementById('list-view');
const detailView = document.getElementById('detail-view');
const noticeBody = document.getElementById('notice-body');

function escapeHtml(text){
  return text.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[m]);
}

function markdownToHtml(md){
  if(!md) return '';
  md = md.replace(/\n{3,}/g,'\n\n')
         .replace(/^# (.*)$/gm,'<h2>$1</h2>')
         .replace(/^## (.*)$/gm,'<h3>$1</h3>')
         .replace(/^- (.*)$/gm,'<li>$1</li>')
         .replace(/\n/g,'<br>');
  return md;
}

// 공지 목록 렌더링
async function renderNoticeList(){
  listView.innerHTML='공지 불러오는 중...';
  try{
    const snapshot = await db.collection('notices').orderBy('createdAt','desc').get();
    if(snapshot.empty){ listView.innerHTML='<p>공지사항이 없습니다.</p>'; return; }
    listView.innerHTML='';
    snapshot.forEach(doc=>{
      const data=doc.data();
      const title=data.title||'제목 없음';
      const preview=data.content?data.content.split('\n')[0]:'';
      const shortPreview=preview.length>60?preview.slice(0,60)+'...':preview;
      const div=document.createElement('div');
      div.className='notice-item';
      div.innerHTML=`<div class="notice-title">${escapeHtml(title)}</div><div class="notice-preview">${escapeHtml(shortPreview)}</div>`;
      div.onclick=()=>loadNotice(doc.id,data);
      listView.appendChild(div);
    });
  }catch(e){ listView.innerHTML='<p>공지 불러오기 실패</p>'; console.error(e);}
}

// 공지 상세보기
function loadNotice(id,data){
  let html='';
  if(data.title) html += `<h2>${escapeHtml(data.title)}</h2>`;
  if(data.imageUrl) html += `<img src="${escapeHtml(data.imageUrl)}" alt="공지 이미지">`;
  if(data.content) html += `<div>${markdownToHtml(data.content)}</div>`;
  noticeBody.innerHTML = html;
  listView.style.display = 'none';
  detailView.style.display = 'flex';
}

// 초기 목록 렌더링
renderNoticeList();

// 테마 토글
const toggleBtn = document.querySelector('.theme-toggle');
toggleBtn.addEventListener('click',toggleTheme);
(function applySavedTheme(){
  if(localStorage.getItem('theme')==='dark'){
    document.body.classList.add('dark');
    toggleBtn.textContent='☀️';
  }
})();
function toggleTheme(){
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  toggleBtn.textContent = isDark?'☀️':'🌙';
  localStorage.setItem('theme',isDark?'dark':'light');
}
</script>
</body>
</html>
